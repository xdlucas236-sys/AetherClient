name: Build y Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - name: Calcular SHA256
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "$h  $($f.Name)" | Out-File -Encoding ascii sha256.txt
          Copy-Item $f.FullName Aether-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: aether-windows
          path: |
            Aether-Setup.exe
            sha256.txt
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Aether-Setup.exe
            sha256.txt
          generate_release_notes: true
